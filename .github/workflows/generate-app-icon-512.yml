name: Generate 512 app icon

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-app-icon-512.yml"
      - "app_icon_192.png"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Generate 512x512 PNG
        run: |
          python - <<'PY'
          from PIL import Image
          img=Image.open("app_icon_192.png").convert("RGBA")
          img=img.resize((512,512), Image.Resampling.LANCZOS)
          img.save("app_icon_512.png", optimize=True)
          PY
      - name: Commit generated icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_icon_512.png
          if git diff --cached --quiet; then
            echo "No icon changes"
          else
            git commit -m "Generate 512x512 app icon"
            git push origin HEAD:main
          fi
