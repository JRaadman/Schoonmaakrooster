  function applyDailyBackground(day){
    // Gebruik een duidelijk wisselend patroon en onthoud de keuze per kalenderdag.
    // Zo kan iOS/PWA nooit per ongeluk de achtergrond van gisteren blijven tonen.
    const now=new Date();
    const dateKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    let index=(Number(day||0)*3)%backgroundSvgs.length;
    try{
      const savedDate=localStorage.getItem('schoonmaak_bg_date')||'';
      const savedIndex=Number(localStorage.getItem('schoonmaak_bg_index'));
      if(savedDate===dateKey && Number.isInteger(savedIndex) && savedIndex>=0 && savedIndex<backgroundSvgs.length){
        index=savedIndex;
      }else{
        const previousIndex=Number(localStorage.getItem('schoonmaak_bg_index'));
        if(Number.isInteger(previousIndex) && previousIndex===index){
          index=(index+3)%backgroundSvgs.length;
        }
        localStorage.setItem('schoonmaak_bg_date',dateKey);
        localStorage.setItem('schoonmaak_bg_index',String(index));
      }
    }catch(e){}
    const svg=backgroundSvgs[index];
    const url='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
    const splash=document.getElementById('splash');
    splash.style.backgroundImage='linear-gradient(rgba(255,239,218,.16),rgba(255,247,232,.12)),url("'+url+'")';
  }

  const params=new URLSearchParams(location.search);
  const incoming=params.get('device')||'';
  const incomingLang=String(params.get('lang')||'').toLowerCase();
  if(incoming){
    try{localStorage.setItem('schoonmaak_device',incoming);}catch(e){}
  }
  if(['nl','en','es','de','it'].includes(incomingLang)){
    try{localStorage.setItem('schoonmaak_lang',incomingLang);}catch(e){}
  }
  if(incoming || incomingLang){
    history.replaceState({},'',location.pathname);
  }

  function getStored(key){try{return localStorage.getItem(key)||'';}catch(e){return '';}}
  function setStored(key,val){try{if(val)localStorage.setItem(key,val);}catch(e){}}
  function removeStored(key){try{localStorage.removeItem(key);}catch(e){}}
  function getToken(){return getStored('schoonmaak_device');}
  function normalizeLang(lang){lang=String(lang||'').toLowerCase();return ['nl','en','es','de','it'].includes(lang)?lang:'';}
  function getAppLang(){return normalizeLang(getStored('schoonmaak_lang'));}
  function getPendingLang(){return normalizeLang(getStored('schoonmaak_lang_pending'));}
  function setAppLang(lang){lang=normalizeLang(lang)||'nl';setStored('schoonmaak_lang',lang);return lang;}
  function targetUrl(){
    const token=getToken();
    const lang=getAppLang()||'nl';
    const pending=getPendingLang();
    const params=[];
    if(token)params.push('device='+encodeURIComponent(token));
    params.push('lang='+encodeURIComponent(lang));
    if(pending && pending===lang)params.push('langChange=1');
    params.push('launcherBuild='+encodeURIComponent(APP_IFRAME_BUILD));
    return BASE+'?'+params.join('&');
  }
  function greetingFor(name){
    const lang=getAppLang()||'nl';
    const h=new Date().getHours();
    const parts={
      nl:h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond',
      en:h<12?'Good morning':h<18?'Good afternoon':'Good evening',
      es:h<12?'Buenos días':h<18?'Buenas tardes':'Buenas noches',
      de:h<12?'Guten Morgen':h<18?'Guten Tag':'Guten Abend',
      it:h<12?'Buongiorno':h<18?'Buon pomeriggio':'Buonasera'
    };
    const part=parts[lang]||parts.nl;
    return name?part+' '+name+'!':part+'!';
  }

  function setPersonalSplash(name){
    const lang=getAppLang()||'nl';
    document.getElementById('greeting').textContent=greetingFor(name||getStored('schoonmaak_name'));
    const day=dayOfYear(new Date());
    applyDailyBackground(day);
    const langRiddles=riddlesByLang[lang]||riddles;
    const langStatements=statementsByLang[lang]||statements;
    const r=langRiddles[day%langRiddles.length];
    const prefix=lang==='en'?'Answer: ':lang==='es'?'Respuesta: ':lang==='de'?'Antwort: ':lang==='it'?'Risposta: ':'Antwoord: ';
    document.getElementById('riddleQ').textContent=r[0];
    document.getElementById('riddleA').textContent=prefix+r[1];
    document.getElementById('statementText').textContent=langStatements[day%langStatements.length];
    applyLauncherLanguage();
    const chooser=document.getElementById('languageChooser');
    if(chooser)chooser.classList.toggle('saved',getStored('schoonmaak_lang_picker_done')==='2');
  }

    const hide=lang==='en'?'Hide answer':lang==='es'?'Ocultar respuesta':lang==='de'?'Antwort ausblenden':lang==='it'?'Nascondi risposta':'Verberg antwoord';

  function currentNotificationPermission_(){
    try{
      if(!('Notification' in window))return 'unsupported';
      return String(Notification.permission||'default');
    }catch(e){return 'unsupported';}
  }

  function sendNotificationPermissionToApp_(){
    try{
      frame.contentWindow.postMessage({
        type:'SCHOONMAAK_NOTIFICATION_PERMISSION',
        permission:currentNotificationPermission_()
      },'*');
    }catch(e){}
  }

  async function requestNotificationPermissionFromSetup_(){
    let permission=currentNotificationPermission_();
    try{
      if(permission==='default' && 'Notification' in window){
        permission=await Notification.requestPermission();
      }
    }catch(e){
      permission=currentNotificationPermission_();
    }
    sendNotificationPermissionToApp_();
    return permission;
  }

  function openRosterFromButton_(){
    // Geen onverwachte browserprompt meer bij het openen van het rooster.
    // Toestemming wordt tijdens de eerste installatie/koppeling bewust gevraagd.
    startAppLoad();
  }

  function showOpenRosterButton_(){
    loadingLine.style.display='none';
    openBtn.style.display='block';
    openBtn.onclick=openRosterFromButton_;
  }

  document.querySelectorAll('.language-btn').forEach(btn=>btn.addEventListener('click',function(){
    const next=setAppLang(this.dataset.lang);
    setStored('schoonmaak_lang_pending',next);
    setStored('schoonmaak_lang_picker_done','2');
    applyLauncherLanguage();
    setPersonalSplash('');

    // Na taalkeuze blijft het beginscherm staan.

    if(!started)showOpenRosterButton_();
  }));

  const frame=document.getElementById('appFrame');
  const splash=document.getElementById('splash');
  const openBtn=document.getElementById('openBtn');
  const loadingLine=document.getElementById('loadingLine');
  let started=false;
  let startedAt=0;
  let lastStartupDiag='';

  function setStartupStatus_(text){
    const target=loadingLine&&loadingLine.querySelector('span:last-child');
    if(target)target.textContent=String(text||'');
  }

  frame.addEventListener('load',function(){
    if(!frame.classList.contains('ready')){
      const lang=getAppLang()||'nl';
      setStartupStatus_(lang==='en'?'Loading schedule…':lang==='es'?'Cargando horario…':lang==='de'?'Plan wird geladen…':lang==='it'?'Caricamento turni…':'Rooster laden…');
    }
  });

  function startAppLoad(){
    if(started)return;
    started=true;startedAt=Date.now();
    openBtn.style.display='none';
    loadingLine.style.display='flex';
    frame.src=targetUrl();

    // Safety fallback starts immediately. Previously this timer only started
    // AFTER the iframe load event, which could make the splash stay visible
    // for roughly a minute even though Apps Script itself was already ready.
    setTimeout(function(){
      if(!frame.classList.contains('ready')){
        const lang=getAppLang()||'nl';
        loadingLine.querySelector('span:last-child').textContent=lang==='en'?'Just a moment, the schedule is loading…':lang==='es'?'Un momento, el horario se está cargando…':lang==='de'?'Einen Moment, der Plan wird geladen…':lang==='it'?'Un momento, i turni si stanno caricando…':'Nog heel even, het rooster wordt geladen…';
      }
    },10000);

    // Niet meer automatisch na 15 seconden het iframe tonen.
    // Het rooster wordt pas zichtbaar zodra de Apps Script-app zelf SCHOONMAAK_READY meldt.
    // Zo krijgt de gebruiker nooit meer een half geladen scherm te zien.
    setTimeout(function(){
      if(!frame.classList.contains('ready')){
        const lang=getAppLang()||'nl';
        loadingLine.querySelector('span:last-child').textContent=lang==='en'?'The schedule is still connecting…':lang==='es'?'El horario sigue conectando…':lang==='de'?'Der Plan stellt noch eine Verbindung her…':lang==='it'?'I turni si stanno ancora collegando…':'Het rooster maakt nog verbinding…';
      }
    },20000);
  }

  function revealApp(name){
    if(name){setStored('schoonmaak_name',name);setPersonalSplash(name);}
    const minSplash=850;
    const wait=Math.max(0,minSplash-(Date.now()-startedAt));
    setTimeout(function(){
      frame.classList.add('ready');
      splash.classList.add('hide');
      setTimeout(function(){splash.style.display='none';},300);
    },wait);
  }

  function showLauncherError(message){
    const lang=getAppLang()||'nl';
    const fallback=lang==='en'?'The schedule could not be loaded.':lang==='es'?'No se pudo cargar el horario.':lang==='de'?'Der Plan konnte nicht geladen werden.':lang==='it'?'Impossibile caricare i turni.':'Het rooster kon niet worden geladen.';
    const text=String(message||fallback);
    const target=loadingLine.querySelector('span:last-child');
    if(target)target.textContent='⚠️ '+text;
    openBtn.style.display='block';
    openBtn.textContent=(getAppLang()==='en'?'Try again':getAppLang()==='es'?'Intentar de nuevo':getAppLang()==='de'?'Erneut versuchen':getAppLang()==='it'?'Riprova':'Opnieuw proberen');
    openBtn.onclick=function(){location.reload();};
  }


  let oneSignalInitPromise=null;
  let oneSignalConfig={appId:'',externalId:'',language:'nl'};

  function sendPushStatusToApp_(status){
    try{
      frame.contentWindow.postMessage(Object.assign({type:'SCHOONMAAK_PUSH_STATUS'},status||{}),'*');
    }catch(e){}
  }

  function ensureOneSignal_(cfg){
    cfg=cfg||{};
    const appId=String(cfg.appId||'').trim();
    const externalId=String(cfg.externalId||'').trim();
    const language=normalizeLang(cfg.language)||getAppLang()||'nl';
    if(!appId||!externalId)return Promise.resolve(null);
    oneSignalConfig={appId,externalId,language};
    if(oneSignalInitPromise)return oneSignalInitPromise;
    window.OneSignalDeferred=window.OneSignalDeferred||[];
    oneSignalInitPromise=new Promise(resolve=>{
      OneSignalDeferred.push(async function(OneSignal){
        try{
          await OneSignal.init({
            appId: appId,
            autoResubscribe: true,
            serviceWorkerPath: '/Schoonmaakrooster/push/onesignal/OneSignalSDKWorker.js',
            serviceWorkerParam: {scope:'/Schoonmaakrooster/push/onesignal/'},
            welcomeNotification: {disable:true},
            notificationClickHandlerMatch:'origin',
            notificationClickHandlerAction:'focus'
          });
          await OneSignal.login(externalId);
          try{OneSignal.User.setLanguage(language);}catch(e){}
          try{
            OneSignal.User.PushSubscription.addEventListener('change',function(){
              sendPushStatusToApp_({
                supported:OneSignal.Notifications.isPushSupported(),
                permission:OneSignal.Notifications.permission===true?'granted':(Notification.permission||'default'),
                optedIn:!!OneSignal.User.PushSubscription.optedIn
              });
            });
          }catch(e){}
          resolve(OneSignal);
        }catch(err){
          oneSignalInitPromise=null;
          sendPushStatusToApp_({supported:false,permission:'error',optedIn:false,error:String(err&&err.message||err||'')});
          resolve(null);
        }
      });
    });
    return oneSignalInitPromise;
  }

  async function reportPushStatus_(){
    const OneSignal=await ensureOneSignal_(oneSignalConfig);
    if(!OneSignal){
      sendPushStatusToApp_({supported:false,permission:'unavailable',optedIn:false});
      return;
    }
    let supported=false;
    try{supported=!!OneSignal.Notifications.isPushSupported();}catch(e){}
    let permission='default';
    try{permission=OneSignal.Notifications.permission===true?'granted':(Notification.permission||'default');}catch(e){}
    let optedIn=false;
    try{optedIn=!!OneSignal.User.PushSubscription.optedIn;}catch(e){}
    sendPushStatusToApp_({supported,permission,optedIn});
  }

  async function subscribePush_(){
    const OneSignal=await ensureOneSignal_(oneSignalConfig);
    if(!OneSignal){await reportPushStatus_();return;}
    try{
      if(!OneSignal.Notifications.isPushSupported()){
        sendPushStatusToApp_({supported:false,permission:'unsupported',optedIn:false});
        return;
      }
      await OneSignal.login(oneSignalConfig.externalId);
      try{OneSignal.User.setLanguage(oneSignalConfig.language);}catch(e){}
      await OneSignal.Notifications.requestPermission();
      try{await OneSignal.User.PushSubscription.optIn();}catch(e){}
    }catch(e){}
    await reportPushStatus_();
  }

  window.addEventListener('message',function(e){
    const data=e.data||{};
    if(data.type==='SCHOONMAAK_NOTIFICATION_STATUS_REQUEST'){
      sendNotificationPermissionToApp_();
      return;
    }
    if(data.type==='SCHOONMAAK_REQUEST_NOTIFICATION_PERMISSION'){
      const lang=normalizeLang(data.language);
      if(lang){
        setStored('schoonmaak_lang',lang);
        applyLauncherLanguage();
      }
      requestNotificationPermissionFromSetup_();
      return;
    }
    if(data.type==='SCHOONMAAK_PUSH_CONFIG'){
      oneSignalConfig={
        appId:String(data.appId||'').trim(),
        externalId:String(data.externalId||'').trim(),
        language:normalizeLang(data.language)||getAppLang()||'nl'
      };
      ensureOneSignal_(oneSignalConfig).then(()=>reportPushStatus_());
      return;
    }
    if(data.type==='SCHOONMAAK_PUSH_STATUS_REQUEST'){
      reportPushStatus_();
      return;
    }
    if(data.type==='SCHOONMAAK_PUSH_SUBSCRIBE'){
      subscribePush_();
      return;
    }
    if(data.type==='SCHOONMAAK_DIAG'){
      // Diagnose blijft intern beschikbaar, maar wordt niet meer aan medewerkers getoond.
      lastStartupDiag=String(data.step||'')+'|'+String(data.detail||'');
      const step=String(data.step||'');
      if(step==='4' && !frame.classList.contains('ready')){
        revealApp(String(data.name||''));
      }
      return;
    }
    if(data.type==='SCHOONMAAK_NOTIFY'){
      try{
        if('Notification' in window && Notification.permission==='granted' && 'serviceWorker' in navigator){
          navigator.serviceWorker.ready.then(reg=>reg.showNotification(String(data.title||'Schoonmaakrooster'),{
            body:String(data.body||''),
            icon:'./app_icon_192.png',
            badge:'./app_icon_192.png',
            tag:String(data.tag||'schoonmaakrooster'),
            renotify:true,
            data:data.data||{url:'./'}
          })).catch(()=>{});
        }
      }catch(_){}
      return;
    }
    if(data.type==='SCHOONMAAK_LANGUAGE'){
      const lang=normalizeLang(data.language);
      if(lang){
        setStored('schoonmaak_lang',lang);
        if(getPendingLang()===lang)removeStored('schoonmaak_lang_pending');
        applyLauncherLanguage();
        setPersonalSplash('');
      }
      return;
    }
    if(data.type==='SCHOONMAAK_READY'){
      const lang=normalizeLang(data.language);
      if(lang){
        setStored('schoonmaak_lang',lang);
        if(getPendingLang()===lang)removeStored('schoonmaak_lang_pending');
        applyLauncherLanguage();
      }
      revealApp(String(data.name||''));
      return;
    }
    if(data.type==='SCHOONMAAK_ERROR'){
      showLauncherError(data.message||'Het rooster kon niet worden geladen.');
    }
  });

  const savedLang=getAppLang();
  const needsLanguageChoice=getStored('schoonmaak_lang_picker_done')!=='2';

  if(needsLanguageChoice){
    // Eerste keer: eerst taal kiezen. Daarna verschijnt 'Rooster openen'.
    loadingLine.style.display='none';
    openBtn.style.display='none';
    const chooser=document.getElementById('languageChooser');
    if(chooser)chooser.classList.remove('saved');
  }else if(savedLang){
    applyLauncherLanguage();
    const chooser=document.getElementById('languageChooser');
    if(chooser)chooser.classList.add('saved');

    // Ook vanuit het app-icoon niet automatisch doorstarten.
    // Zo blijft er tijd voor het raadsel en de stelling.
    showOpenRosterButton_();
  }else{
    loadingLine.style.display='none';
    openBtn.style.display='none';
  }
})();
</script>
