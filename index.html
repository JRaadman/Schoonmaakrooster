<style>
:root{--green:#226b5f;--bg:#eef8f5;--text:#173d36;--muted:#627873;--line:#dce8e4}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}
body{overflow:hidden}
#splash{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#eef8f5 0%,#f7fbfa 100%);background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity .28s ease}

.logo{width:98px;height:98px;border-radius:23px;box-shadow:0 7px 20px rgba(0,0,0,.10)}
.greeting{font-size:29px;font-weight:950;letter-spacing:-.4px;margin:18px 0 5px}
.wish{font-size:16px;line-height:1.45;color:var(--muted);font-weight:650;margin:0 auto 14px;max-width:310px}
.language-chooser{margin:0 0 16px}.language-chooser.saved{display:none}
.language-title{font-size:11px;font-weight:900;letter-spacing:.35px;color:#6d817c;margin-bottom:8px}
.language-buttons{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.language-btn{min-width:54px;border:1px solid rgba(34,107,95,.22);background:rgba(255,255,255,.62);color:var(--green);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:950;box-shadow:0 2px 8px rgba(18,67,58,.06)}
.language-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.riddle{background:rgba(245,250,248,.78);border:1px solid rgba(222,235,231,.90);border-radius:18px;padding:15px 16px;text-align:left;margin:0 0 16px}
.riddle-title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:var(--green);margin-bottom:6px}
.riddle-q{font-size:15px;line-height:1.4;font-weight:750;color:#244b44}
.riddle-answer{display:none;margin-top:8px;font-size:14px;color:#54716a;font-weight:700}
.riddle-answer.show{display:block}
.answer-btn{margin-top:9px;border:0;background:transparent;color:var(--green);font-size:13px;font-weight:900;padding:3px 0;touch-action:manipulation}
.statement{background:rgba(255,248,232,.80);border:1px solid rgba(241,223,173,.92);border-radius:18px;padding:13px 16px;text-align:left;margin:-4px 0 16px}
.statement-title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:#8a6500;margin-bottom:5px}
.statement-text{font-size:14px;line-height:1.4;font-weight:750;color:#4d4635}
@media(max-height:760px){
  .card{padding:20px 20px 18px}
  .logo{width:76px;height:76px}
  .greeting{font-size:25px;margin-top:12px}
  .wish{margin-bottom:12px}
  .riddle{padding:12px 14px;margin-bottom:10px}
  .statement{padding:11px 14px;margin-bottom:10px}

.loading-line{display:flex;align-items:center;justify-content:center;gap:9px;color:#5c726d;font-size:14px;font-weight:800;min-height:30px}
.spinner{width:18px;height:18px;border:3px solid #d8e9e4;border-top-color:var(--green);border-radius:50%;animation:spin .75s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.primary{display:none;width:100%;margin-top:12px;border:0;border-radius:15px;padding:16px 18px;min-height:54px;font-size:17px;font-weight:900;background:var(--green);color:#fff;touch-action:manipulation}
.small{font-size:12px;margin-top:13px;color:#83948f}

#appFrame{width:100%;height:100%;border:0;display:block;background:#fff;opacity:1;visibility:visible;pointer-events:none}

#notificationPermissionOverlay{position:fixed;inset:0;z-index:300;background:rgba(22,31,29,.48);display:none;align-items:flex-end;justify-content:center;padding:18px}

.notification-permission-card{width:min(520px,100%);background:#fff;border-radius:26px;padding:24px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:0 18px 50px rgba(0,0,0,.24)}

#notificationPermissionCancel{background:#fff;border:1px solid #d9dfdd;color:#222}

.app-update-card{pointer-events:auto;width:min(560px,100%);display:flex;align-items:center;gap:10px;background:#173d36;color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:11px 12px;box-shadow:0 10px 28px rgba(0,0,0,.25)}

#appUpdateNow:disabled{opacity:.55}

  const PENDING_PUSH_OPEN_KEY='schoonmaak_pending_push_open_v1';
  const PENDING_PUSH_OPEN_MAX_AGE_MS=2*60*1000;

  // Betrouwbare brug tussen de serviceworker en een reeds geopende PWA.
  // De serviceworker bewaart een klik eerst persistent in IndexedDB. Daardoor
  // kan de launcher hem na hervatten zelf ophalen; er kan geen postMessage
  // verloren gaan doordat iOS/Android de pagina nog aan het wakker maken is.
  const PUSH_CLICK_DB='schoonmaak_push_click_bridge_v1';
  const PUSH_CLICK_STORE='kv';
  const PUSH_CLICK_KEY='pending';

  function openPushClickDb_(){
    return new Promise((resolve,reject)=>{
      try{
        const req=indexedDB.open(PUSH_CLICK_DB,1);
        req.onupgradeneeded=()=>{
          const db=req.result;
          if(!db.objectStoreNames.contains(PUSH_CLICK_STORE))db.createObjectStore(PUSH_CLICK_STORE);
        };
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>reject(req.error||new Error('indexeddb-open-failed'));
      }catch(err){reject(err);}
    });
  }
  async function readStoredPushClick_(){
    try{
      const db=await openPushClickDb_();
      const rec=await new Promise((resolve,reject)=>{
        const tx=db.transaction(PUSH_CLICK_STORE,'readonly');
        const req=tx.objectStore(PUSH_CLICK_STORE).get(PUSH_CLICK_KEY);
        req.onsuccess=()=>resolve(req.result||null);
        req.onerror=()=>reject(req.error||new Error('indexeddb-read-failed'));
      });
      try{db.close();}catch(e){}
      if(!rec||!rec.data||!String(rec.data.pushId||'').trim())return null;
      const savedAt=Number(rec.savedAt||0);
      if(!savedAt||Date.now()-savedAt>PENDING_PUSH_OPEN_MAX_AGE_MS){
        await clearStoredPushClick_();
        return null;
      }
      return rec.data;
    }catch(e){return null;}
  }
  async function clearStoredPushClick_(){
    try{
      const db=await openPushClickDb_();
      await new Promise((resolve,reject)=>{
        const tx=db.transaction(PUSH_CLICK_STORE,'readwrite');
        const req=tx.objectStore(PUSH_CLICK_STORE).delete(PUSH_CLICK_KEY);
        req.onsuccess=()=>resolve();
        req.onerror=()=>reject(req.error||new Error('indexeddb-delete-failed'));
      });
      try{db.close();}catch(e){}
    }catch(e){}
  }
  function savePendingPushOpen_(payload){
    const data=Object.assign({},payload||{});
    if(!String(data.pushId||'').trim())return;
    data._savedAt=Date.now();
    try{localStorage.setItem(PENDING_PUSH_OPEN_KEY,JSON.stringify(data));}catch(e){}
  }
  function loadPendingPushOpen_(){
    try{
      const data=JSON.parse(localStorage.getItem(PENDING_PUSH_OPEN_KEY)||'null');
      if(!data||!String(data.pushId||'').trim())return null;
      const savedAt=Number(data._savedAt||0);
      if(!savedAt||Date.now()-savedAt>PENDING_PUSH_OPEN_MAX_AGE_MS){
        localStorage.removeItem(PENDING_PUSH_OPEN_KEY);
        return null;
      }
      return data;
    }catch(e){return null;}
  }
  function clearPendingPushOpen_(pushId){
    try{
      const cur=loadPendingPushOpen_();
      if(!cur)return;
      if(!pushId||String(cur.pushId||'')===String(pushId||''))localStorage.removeItem(PENDING_PUSH_OPEN_KEY);
    }catch(e){}
  }

  const frame=document.getElementById('appFrame');

  function deliverPendingPushOpen_(){
    const pending=loadPendingPushOpen_();
    if(!pending||!String(pending.pushId||'').trim())return false;
    try{
      frame.contentWindow.postMessage({type:'SCHOONMAAK_NOTIFICATION_CLICK',data:pending},'*');
      return true;
    }catch(e){return false;}
  }

  let pendingPushRetryTimers=[];
  function cancelPendingPushRetries_(){
    pendingPushRetryTimers.forEach(function(id){try{clearTimeout(id);}catch(e){}});
    pendingPushRetryTimers=[];
  }
  function schedulePendingPushDelivery_(){
    if(!loadPendingPushOpen_())return;
    cancelPendingPushRetries_();
    [0,120,320,700,1200,2000,3200,4800].forEach(function(delay){
      const id=setTimeout(function(){
        if(!loadPendingPushOpen_())return;
        deliverPendingPushOpen_();
      },delay);
      pendingPushRetryTimers.push(id);
    });
  }
  function receivePushClick_(payload){
    const data=payload||{};
    if(!String(data.pushId||'').trim())return;
    savePendingPushOpen_(data);
    // Een echte pushklik mag de app openen wanneer alleen het startscherm zichtbaar is.
    if(!started){
      setTimeout(function(){if(!started)startAppLoad();},20);
    }
    schedulePendingPushDelivery_();
  }

  let storedPushPullBusy=false;
  let storedPushPullTimers=[];

  async function pullStoredPushClick_(){
    if(storedPushPullBusy)return;
    storedPushPullBusy=true;
    try{
      const payload=await readStoredPushClick_();
      if(payload&&String(payload.pushId||'').trim()){
        // Eerst lokaal veiligstellen, pas daarna uit IndexedDB verwijderen.
        receivePushClick_(payload);
        await clearStoredPushClick_();
      }
    }finally{
      storedPushPullBusy=false;
    }
  }
  function scheduleStoredPushPull_(){
    storedPushPullTimers.forEach(id=>{try{clearTimeout(id);}catch(e){}});
    storedPushPullTimers=[];
    [0,100,300,700,1300,2200,3500].forEach(delay=>{
      storedPushPullTimers.push(setTimeout(pullStoredPushClick_,delay));
    });
  }

  let oneSignalInitPromise=null;

  function sendPushStatusToApp_(status){

      frame.contentWindow.postMessage(Object.assign({type:'SCHOONMAAK_PUSH_STATUS'},status||{}),'*');

  function oneSignalStatus_(OneSignal){
    let supported=false;
    try{supported=!!OneSignal.Notifications.isPushSupported();}catch(e){}
    let permission='default';
    try{
      permission=String(OneSignal.Notifications.permissionNative||'').toLowerCase();
      if(!permission||!['default','granted','denied'].includes(permission)){
        permission=OneSignal.Notifications.permission===true?'granted':(Notification.permission||'default');
      }
    }catch(e){
      try{permission=Notification.permission||'default';}catch(_){}
    }
    let optedIn=false;
    let subscriptionId='';
    try{optedIn=!!OneSignal.User.PushSubscription.optedIn;}catch(e){}
    try{subscriptionId=String(OneSignal.User.PushSubscription.id||'');}catch(e){}
    return {
      supported,
      permission,
      optedIn,
      subscriptionId,
      externalId:String(oneSignalConfig.externalId||''),
      cloudReady:supported&&permission==='granted'&&optedIn&&!!subscriptionId
    };
  }

  function ensureOneSignal_(cfg){
    cfg=cfg||{};
    const appId=String(cfg.appId||'').trim();
    const externalId=String(cfg.externalId||'').trim();
    const language=normalizeLang(cfg.language)||getAppLang()||'nl';
    const subscribe=cfg.subscribe===true;
    if(!appId||!externalId)return Promise.resolve(null);
    oneSignalConfig={appId,externalId,language,subscribe};
    if(oneSignalInitPromise)return oneSignalInitPromise;
    window.OneSignalDeferred=window.OneSignalDeferred||[];
    oneSignalInitPromise=new Promise(resolve=>{
      OneSignalDeferred.push(async function(OneSignal){
        try{
          await OneSignal.init({
            appId: appId,
            autoResubscribe: true,
            serviceWorkerPath: 'push/onesignal/OneSignalSDKWorker.js',
            serviceWorkerParam: {scope:'/Schoonmaakrooster/push/onesignal/'},
            welcomeNotification: {disable:true},
            notificationClickHandlerMatch:'origin',
            notificationClickHandlerAction:'focus'
          });
          await OneSignal.login(externalId);
          try{OneSignal.User.setLanguage(language);}catch(e){}

          // Bestaande telefoons hebben de native toestemming al gegeven.
          // Maak dan ook de echte OneSignal web-pushsubscription aan zonder
          // opnieuw een eigen permissiedialoog te tonen.
          if(oneSignalConfig.subscribe===true){
            try{
              const nativePermission=String(Notification.permission||'default');
              if(nativePermission==='granted'&&!OneSignal.User.PushSubscription.optedIn){
                await OneSignal.User.PushSubscription.optIn();
              }
            }catch(e){}
          }

          try{
            OneSignal.Notifications.addEventListener('foregroundWillDisplay',function(event){
              const n=(event&&event.notification)||{};
              const additional=Object.assign({},n.additionalData||n.data||{});
              additional.title=n.title||additional.title||'';
              additional.body=n.body||additional.body||'';

              // Staat het rooster echt in beeld, dan geen dubbele iOS-banner.
              // De mobiele app verwerkt dezelfde push meteen in-app.
              if(document.visibilityState==='visible'){
                try{event.preventDefault();}catch(e){}
                try{
                  frame.contentWindow.postMessage({
                    type:'SCHOONMAAK_CLOUD_FOREGROUND',
                    data:additional
                  },'*');
                }catch(e){}
              }
            });
          }catch(e){}

          try{
            OneSignal.Notifications.addEventListener('click',function(event){
              const n=(event&&event.notification)||{};
              const additional=(n.additionalData||n.data||{});
              const pushId=String(additional.pushId||'').trim();
              if(pushId){
                savePendingPushOpen_(Object.assign({},additional,{
                  pushId:pushId,
                  title:n.title||additional.title||'',
                  body:n.body||additional.body||''
                }));
                deliverPendingPushOpen_();
              }
            });
          }catch(e){}

          try{
            OneSignal.User.PushSubscription.addEventListener('change',function(){
              sendPushStatusToApp_(oneSignalStatus_(OneSignal));
            });
          }catch(e){}

          sendPushStatusToApp_(oneSignalStatus_(OneSignal));
          resolve(OneSignal);
        }catch(err){
          oneSignalInitPromise=null;
          sendPushStatusToApp_({
            supported:false,
            permission:'error',
            optedIn:false,
            subscriptionId:'',
            externalId:String(externalId||''),
            cloudReady:false,
            error:String(err&&err.message||err||'')
          });
          resolve(null);
        }
      });
    });
    return oneSignalInitPromise;
  }

  async function reportPushStatus_(){
    const OneSignal=await ensureOneSignal_(oneSignalConfig);
    if(!OneSignal){
      sendPushStatusToApp_({
        supported:false,
        permission:'unavailable',
        optedIn:false,
        subscriptionId:'',
        externalId:String(oneSignalConfig.externalId||''),
        cloudReady:false
      });
      return;
    }
    sendPushStatusToApp_(oneSignalStatus_(OneSignal));
  }

  async function subscribePush_(){
    oneSignalConfig.subscribe=true;
    const OneSignal=await ensureOneSignal_(oneSignalConfig);
    if(!OneSignal){await reportPushStatus_();return;}
    try{
      if(!OneSignal.Notifications.isPushSupported()){
        sendPushStatusToApp_({
          supported:false,
          permission:'unsupported',
          optedIn:false,
          subscriptionId:'',
          externalId:String(oneSignalConfig.externalId||''),
          cloudReady:false
        });
        return;
      }
      await OneSignal.login(oneSignalConfig.externalId);
      try{OneSignal.User.setLanguage(oneSignalConfig.language);}catch(e){}
      if(String(Notification.permission||'default')!=='granted'){
        await OneSignal.Notifications.requestPermission();
      }
      try{await OneSignal.User.PushSubscription.optIn();}catch(e){}
    }catch(e){}
    // iOS kan het subscription-id net iets later opleveren.
    await reportPushStatus_();
    setTimeout(reportPushStatus_,700);
    setTimeout(reportPushStatus_,1800);
  }

  async function unsubscribePush_(){
    oneSignalConfig.subscribe=false;
    const OneSignal=await ensureOneSignal_(oneSignalConfig);
    if(!OneSignal){await reportPushStatus_();return;}
    try{await OneSignal.User.PushSubscription.optOut();}catch(e){}
    await reportPushStatus_();
  }

  window.addEventListener('message',function(e){

    if(data.type==='SCHOONMAAK_HOLIDAY_PREVIEW'){

      holidayPreviewTheme_=allowed.includes(String(data.theme||'').toLowerCase())?String(data.theme).toLowerCase():'festive';

      holidayPreviewTheme_='';

      setPersonalSplash(getStored('schoonmaak_name'));
      if(frame&&frame.classList.contains('ready'))splash?.classList.add('hide');
      return;

    if(data.type==='SCHOONMAAK_NOTIFICATION_STATUS_REQUEST'){
      // Antwoord rechtstreeks naar precies het venster dat de status vroeg.
      // Dit is nodig omdat Apps Script op sommige telefoons een extra wrapper
      // tussen de app en de launcher gebruikt.
      sendNotificationPermissionToApp_(e.source);
      return;
    }
    if(data.type==='SCHOONMAAK_REQUEST_NOTIFICATION_PERMISSION'){
      const lang=normalizeLang(data.language);
      if(lang){
        setStored('schoonmaak_lang',lang);
        applyLauncherLanguage();
      }
      notificationPermissionRequester=e.source||notificationPermissionRequester;
      // Een permissievraag vanuit een iframe/postMessage telt op iOS/Android niet
      // altijd als directe gebruikersklik. Daarom tonen we eerst een knop in de
      // bovenliggende pagina; die knop vraagt de systeemtoestemming wél direct.
      openNotificationPermissionDialog_(lang||getAppLang(),e.source);
      return;
    }
    if(data.type==='SCHOONMAAK_PUSH_CONFIG'){
      oneSignalConfig={
        appId:String(data.appId||'').trim(),
        externalId:String(data.externalId||'').trim(),
        language:normalizeLang(data.language)||getAppLang()||'nl',
        subscribe:data.subscribe===true
      };
      ensureOneSignal_(oneSignalConfig).then(async OneSignal=>{
        if(OneSignal&&oneSignalConfig.subscribe===true){
          try{
            if(String(Notification.permission||'default')==='granted'&&!OneSignal.User.PushSubscription.optedIn){
              await OneSignal.User.PushSubscription.optIn();
            }
          }catch(e){}
        }
        reportPushStatus_();
      });
      return;
    }
    if(data.type==='SCHOONMAAK_PUSH_STATUS_REQUEST'){
      reportPushStatus_();
      return;
    }
    if(data.type==='SCHOONMAAK_PUSH_SUBSCRIBE'){
      subscribePush_();
      return;
    }
    if(data.type==='SCHOONMAAK_PUSH_UNSUBSCRIBE'){
      unsubscribePush_();
      return;
    }
    if(data.type==='SCHOONMAAK_DIAG'){
      // Diagnose blijft intern beschikbaar, maar wordt niet meer aan medewerkers getoond.
      lastStartupDiag=String(data.step||'')+'|'+String(data.detail||'');
      const step=String(data.step||'');
      if(step==='4' && !frame.classList.contains('ready')){
        revealApp(String(data.name||''));
      }
      return;
    }
    if(data.type==='SCHOONMAAK_NOTIFICATION_CLICK_ACK'){
      const pushId=String(data.pushId||'').trim();
      clearPendingPushOpen_(pushId);
      clearStoredPushClick_();
      cancelPendingPushRetries_();
      return;
    }
    if(data.type==='SCHOONMAAK_NOTIFY'){
      const replyTarget=e.source||null;
      const title=String(data.title||'Schoonmaakrooster');
      const body=String(data.body||'');
      const notifyData=Object.assign({},data.data||{});
      const pushId=String(notifyData.pushId||'').trim();
      notifyData.title=notifyData.title||title;
      notifyData.body=notifyData.body||body;
      try{
        const launch=new URL(location.href);
        launch.searchParams.delete('pushOpen');
        notifyData.url=launch.toString();
      }catch(err){notifyData.url=notifyData.url||'./';}

      const sendResult=function(ok,error){
        if(!pushId)return;
        try{
          const payload={type:'SCHOONMAAK_NOTIFY_RESULT',ok:ok===true,pushId:pushId,error:String(error||'')};
          if(replyTarget)replyTarget.postMessage(payload,'*');
          else if(frame&&frame.contentWindow)frame.contentWindow.postMessage(payload,'*');
        }catch(err){}
      };

      try{
        if(!('Notification' in window)){
          sendResult(false,'notifications-unsupported');
        }else if(Notification.permission!=='granted'){
          sendResult(false,'permission-'+String(Notification.permission||'default'));
        }else if(!('serviceWorker' in navigator)){
          sendResult(false,'service-worker-unsupported');
        }else{
          navigator.serviceWorker.ready
            .then(reg=>reg.showNotification(title,{
              body:body,
              icon:'./app_icon_192.png',
              badge:'./app_icon_192.png',
              tag:String(data.tag||'schoonmaakrooster'),
              renotify:true,
              data:notifyData
            }))
            .then(()=>sendResult(true,''))
            .catch(err=>sendResult(false,String(err&&err.message||err||'show-notification-failed')));
        }
      }catch(err){
        sendResult(false,String(err&&err.message||err||'notification-failed'));
      }
      return;
    }
    if(data.type==='SCHOONMAAK_LANGUAGE'){
      const lang=normalizeLang(data.language);
      if(lang){
        setStored('schoonmaak_lang',lang);
        if(getPendingLang()===lang)removeStored('schoonmaak_lang_pending');
        applyLauncherLanguage();
        setPersonalSplash('');
      }
      return;
    }
    if(data.type==='SCHOONMAAK_READY'){
      const lang=normalizeLang(data.language);
      if(lang){
        setStored('schoonmaak_lang',lang);
        if(getPendingLang()===lang)removeStored('schoonmaak_lang_pending');
        applyLauncherLanguage();
      }
      revealApp(String(data.name||''));
      if(loadPendingPushOpen_())schedulePendingPushDelivery_();
      return;
    }
    if(data.type==='SCHOONMAAK_ERROR'){
      showLauncherError(data.message||'Het rooster kon niet worden geladen.');
    }
  });

  const savedLang=getAppLang();
  const needsLanguageChoice=getStored('schoonmaak_lang_picker_done')!=='2';

  if(needsLanguageChoice){
    // Eerste keer: eerst taal kiezen. Daarna verschijnt 'Rooster openen'.
    loadingLine.style.display='none';
    openBtn.style.display='none';
    const chooser=document.getElementById('languageChooser');
    if(chooser)chooser.classList.remove('saved');
  }else if(savedLang){
    applyLauncherLanguage();
    const chooser=document.getElementById('languageChooser');
    if(chooser)chooser.classList.add('saved');

    // Ook vanuit het app-icoon niet automatisch doorstarten.
    // Zo blijft er tijd voor het raadsel en de stelling.
    showOpenRosterButton_();
  }else{
    loadingLine.style.display='none';
    openBtn.style.display='none';
  }

  if(loadPendingPushOpen_()&&String(loadPendingPushOpen_().pushId||'').trim()){
    setTimeout(function(){if(!started)startAppLoad();},120);
  }

  // Bewust pas na de normale start: de versiecontrole mag de snelle appstart
  // nooit blokkeren.
  setTimeout(checkForAppUpdate_,4500);
  setInterval(checkForAppUpdate_,15*60*1000);
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible')setTimeout(checkForAppUpdate_,700);
  });
})();
</script>
</body>
</html>
