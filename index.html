<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--green:#226b5f;--bg:#eef8f5;--text:#173d36;--muted:#627873;--line:#dce8e4}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}
body{overflow:hidden}
#splash{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#eef8f5 0%,#f7fbfa 100%);background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity .28s ease}
#splash.hide{opacity:0;pointer-events:none}
.card{width:min(410px,100%);background:rgba(255,255,255,.56);backdrop-filter:blur(1.7px);-webkit-backdrop-filter:blur(1.7px);border:1px solid rgba(255,255,255,.64);border-radius:28px;padding:28px 24px 24px;text-align:center;box-shadow:0 14px 42px rgba(18,67,58,.14)}
.logo{width:98px;height:98px;border-radius:23px;box-shadow:0 7px 20px rgba(0,0,0,.10)}
.greeting{font-size:29px;font-weight:950;letter-spacing:-.4px;margin:18px 0 5px}
.wish{font-size:16px;line-height:1.45;color:var(--muted);font-weight:650;margin:0 auto 14px;max-width:310px}
.language-chooser{margin:0 0 16px}.language-chooser.saved{display:none}
.language-title{font-size:11px;font-weight:900;letter-spacing:.35px;color:#6d817c;margin-bottom:8px}
.language-buttons{display:flex;justify-content:center;gap:8px}
.language-btn{min-width:58px;border:1px solid rgba(34,107,95,.22);background:rgba(255,255,255,.62);color:var(--green);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:950;box-shadow:0 2px 8px rgba(18,67,58,.06)}
.language-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.riddle{background:rgba(245,250,248,.78);border:1px solid rgba(222,235,231,.90);border-radius:18px;padding:15px 16px;text-align:left;margin:0 0 16px}
.riddle-title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:var(--green);margin-bottom:6px}
.riddle-q{font-size:15px;line-height:1.4;font-weight:750;color:#244b44}
.riddle-answer{display:none;margin-top:8px;font-size:14px;color:#54716a;font-weight:700}
.riddle-answer.show{display:block}
.answer-btn{margin-top:9px;border:0;background:transparent;color:var(--green);font-size:13px;font-weight:900;padding:3px 0;touch-action:manipulation}
.statement{background:rgba(255,248,232,.80);border:1px solid rgba(241,223,173,.92);border-radius:18px;padding:13px 16px;text-align:left;margin:-4px 0 16px}
.statement-title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:#8a6500;margin-bottom:5px}
.statement-text{font-size:14px;line-height:1.4;font-weight:750;color:#4d4635}
@media(max-height:760px){
  .card{padding:20px 20px 18px}
  .logo{width:76px;height:76px}
  .greeting{font-size:25px;margin-top:12px}
  .wish{margin-bottom:12px}
  .riddle{padding:12px 14px;margin-bottom:10px}
  .statement{padding:11px 14px;margin-bottom:10px}
}
.loading-line{display:flex;align-items:center;justify-content:center;gap:9px;color:#5c726d;font-size:14px;font-weight:800;min-height:30px}
.spinner{width:18px;height:18px;border:3px solid #d8e9e4;border-top-color:var(--green);border-radius:50%;animation:spin .75s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.primary{display:none;width:100%;margin-top:12px;border:0;border-radius:15px;padding:16px 18px;min-height:54px;font-size:17px;font-weight:900;background:var(--green);color:#fff;touch-action:manipulation}
.small{font-size:12px;margin-top:13px;color:#83948f}
#appShell{position:fixed;inset:0;z-index:1;background:#fff}
#appFrame{width:100%;height:100%;border:0;display:block;background:#fff;opacity:1;visibility:visible;pointer-events:none}
#appFrame.ready{pointer-events:auto}
</style>
</head>

    <div class="statement">

    <button class="primary" id="openBtn" type="button">Rooster openen</button>
    <div class="small">Capfun Het Winkel</div>
  </section>
</main>
<section id="appShell" aria-label="Schoonmaakrooster app">
  <iframe id="appFrame" title="Schoonmaakrooster" loading="eager" allow="geolocation; camera; microphone; clipboard-read; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>

  ];

  function applyDailyBackground(day){
    // Gebruik een duidelijk wisselend patroon en onthoud de keuze per kalenderdag.
    // Zo kan iOS/PWA nooit per ongeluk de achtergrond van gisteren blijven tonen.
    const now=new Date();
    const dateKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    let index=(Number(day||0)*3)%backgroundSvgs.length;
    try{
      const savedDate=localStorage.getItem('schoonmaak_bg_date')||'';
      const savedIndex=Number(localStorage.getItem('schoonmaak_bg_index'));
      if(savedDate===dateKey && Number.isInteger(savedIndex) && savedIndex>=0 && savedIndex<backgroundSvgs.length){
        index=savedIndex;
      }else{
        const previousIndex=Number(localStorage.getItem('schoonmaak_bg_index'));
        if(Number.isInteger(previousIndex) && previousIndex===index){
          index=(index+3)%backgroundSvgs.length;
        }
        localStorage.setItem('schoonmaak_bg_date',dateKey);
        localStorage.setItem('schoonmaak_bg_index',String(index));
      }
    }catch(e){}
    const svg=backgroundSvgs[index];
    const url='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
    const splash=document.getElementById('splash');
    splash.style.backgroundImage='linear-gradient(rgba(244,250,248,.06),rgba(250,252,251,.08)),url("'+url+'")';
  }

  const params=new URLSearchParams(location.search);
  const incoming=params.get('device')||'';
  const incomingLang=String(params.get('lang')||'').toLowerCase();
  if(incoming){
    try{localStorage.setItem('schoonmaak_device',incoming);}catch(e){}
  }
  if(['nl','en','es'].includes(incomingLang)){
    try{localStorage.setItem('schoonmaak_lang',incomingLang);}catch(e){}
  }
  if(incoming || incomingLang){
    history.replaceState({},'',location.pathname);
  }

  function getStored(key){try{return localStorage.getItem(key)||'';}catch(e){return '';}}
  function setStored(key,val){try{if(val)localStorage.setItem(key,val);}catch(e){}}
  function removeStored(key){try{localStorage.removeItem(key);}catch(e){}}
  function getToken(){return getStored('schoonmaak_device');}
  function normalizeLang(lang){lang=String(lang||'').toLowerCase();return ['nl','en','es'].includes(lang)?lang:'';}
  function getAppLang(){return normalizeLang(getStored('schoonmaak_lang'));}
  function getPendingLang(){return normalizeLang(getStored('schoonmaak_lang_pending'));}
  function setAppLang(lang){lang=normalizeLang(lang)||'nl';setStored('schoonmaak_lang',lang);return lang;}
  function targetUrl(){
    const token=getToken();
    const lang=getAppLang()||'nl';
    const pending=getPendingLang();
    const params=[];
    if(token)params.push('device='+encodeURIComponent(token));
    params.push('lang='+encodeURIComponent(lang));
    if(pending && pending===lang)params.push('langChange=1');
    params.push('launcherBuild='+encodeURIComponent(APP_IFRAME_BUILD));
    return BASE+'?'+params.join('&');
  }
  function greetingFor(name){
    const lang=getAppLang()||'nl';
    const h=new Date().getHours();
    const parts={
      nl:h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond',
      en:h<12?'Good morning':h<18?'Good afternoon':'Good evening',
      es:h<12?'Buenos días':h<18?'Buenas tardes':'Buenas noches'
    };
    const part=parts[lang]||parts.nl;
    return name?part+' '+name+'!':part+'!';
  }
  function dayOfYear(d){const start=new Date(d.getFullYear(),0,0);return Math.floor((d-start)/86400000);}
  function applyLauncherLanguage(){
    const lang=getAppLang()||'nl';
    const text={
      nl:{wish:'Wij wensen jou een fijne werkdag toe!',riddle:'Raadsel van de dag',answer:'Toon antwoord',hide:'Verberg antwoord',answerPrefix:'Antwoord: ',statement:'Stelling van de dag',loading:'Rooster wordt klaargezet…',later:'Nog heel even, het rooster wordt geladen…',connecting:'Het rooster maakt nog verbinding…',open:'Rooster openen',retry:'Opnieuw proberen'},
      en:{wish:'We wish you a pleasant working day!',riddle:'Riddle of the day',answer:'Show answer',hide:'Hide answer',answerPrefix:'Answer: ',statement:'Statement of the day',loading:'Preparing the schedule…',later:'Just a moment, the schedule is loading…',connecting:'The schedule is still connecting…',open:'Open schedule',retry:'Try again'},
      es:{wish:'¡Que tengas una buena jornada de trabajo!',riddle:'Acertijo del día',answer:'Mostrar respuesta',hide:'Ocultar respuesta',answerPrefix:'Respuesta: ',statement:'Frase del día',loading:'Preparando el horario…',later:'Un momento, el horario se está cargando…',connecting:'El horario sigue conectando…',open:'Abrir horario',retry:'Intentar de nuevo'}
    }[lang];
    document.documentElement.lang=lang;
    document.getElementById('wish').textContent=text.wish;
    document.querySelector('.riddle-title').textContent=text.riddle;
    document.querySelector('.statement-title').textContent=text.statement;
    document.getElementById('answerBtn').textContent=text.answer;
    document.getElementById('openBtn').textContent=text.open;
    document.querySelectorAll('.language-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.lang===lang));
  }
  function setPersonalSplash(name){
    const lang=getAppLang()||'nl';
    document.getElementById('greeting').textContent=greetingFor(name||getStored('schoonmaak_name'));
    const day=dayOfYear(new Date());
    applyDailyBackground(day);
    const langRiddles=riddlesByLang[lang]||riddles;
    const langStatements=statementsByLang[lang]||statements;
    const r=langRiddles[day%langRiddles.length];
    const prefix=lang==='en'?'Answer: ':lang==='es'?'Respuesta: ':'Antwoord: ';
    document.getElementById('riddleQ').textContent=r[0];
    document.getElementById('riddleA').textContent=prefix+r[1];
    document.getElementById('statementText').textContent=langStatements[day%langStatements.length];
    applyLauncherLanguage();
    const chooser=document.getElementById('languageChooser');
    if(chooser)chooser.classList.toggle('saved',getStored('schoonmaak_lang_picker_done')==='2');
  }

  setPersonalSplash('');
  document.getElementById('answerBtn').addEventListener('click',function(){
    const a=document.getElementById('riddleA');
    a.classList.toggle('show');
    const lang=getAppLang()||'nl';
    const show=lang==='en'?'Show answer':lang==='es'?'Mostrar respuesta':'Toon antwoord';
    const hide=lang==='en'?'Hide answer':lang==='es'?'Ocultar respuesta':'Verberg antwoord';
    this.textContent=a.classList.contains('show')?hide:show;
  });

  document.querySelectorAll('.language-btn').forEach(btn=>btn.addEventListener('click',function(){
    const next=setAppLang(this.dataset.lang);
    setStored('schoonmaak_lang_pending',next);
    setStored('schoonmaak_lang_picker_done','2');
    applyLauncherLanguage();
    setPersonalSplash('');
    if(started){
      location.reload();
      return;
    }
    startAppLoad();
  }));

  const frame=document.getElementById('appFrame');
  const splash=document.getElementById('splash');
  const openBtn=document.getElementById('openBtn');
  const loadingLine=document.getElementById('loadingLine');
  let started=false;
  let startedAt=0;
  let lastStartupDiag='';

  function setStartupStatus_(text){
    const target=loadingLine&&loadingLine.querySelector('span:last-child');
    if(target)target.textContent=String(text||'');
  }

  frame.addEventListener('load',function(){
    if(!frame.classList.contains('ready')&&!lastStartupDiag){
      setStartupStatus_('App-scherm geladen · roosterdata ophalen…');
    }
  });

  function startAppLoad(){
    if(started)return;
    started=true;startedAt=Date.now();
    openBtn.style.display='none';
    loadingLine.style.display='flex';
    frame.src=targetUrl();

    // Safety fallback starts immediately. Previously this timer only started
    // AFTER the iframe load event, which could make the splash stay visible
    // for roughly a minute even though Apps Script itself was already ready.
    setTimeout(function(){
      if(!frame.classList.contains('ready')){
        const lang=getAppLang()||'nl';
        loadingLine.querySelector('span:last-child').textContent=lang==='en'?'Just a moment, the schedule is loading…':lang==='es'?'Un momento, el horario se está cargando…':'Nog heel even, het rooster wordt geladen…';
      }
    },10000);

    // Niet meer automatisch na 15 seconden het iframe tonen.
    // Het rooster wordt pas zichtbaar zodra de Apps Script-app zelf SCHOONMAAK_READY meldt.
    // Zo krijgt de gebruiker nooit meer een half geladen scherm te zien.
    setTimeout(function(){
      if(!frame.classList.contains('ready')){
        const lang=getAppLang()||'nl';
        loadingLine.querySelector('span:last-child').textContent=lang==='en'?'The schedule is still connecting…':lang==='es'?'El horario sigue conectando…':'Het rooster maakt nog verbinding…';
      }
    },20000);
  }

  function revealApp(name){
    if(name){setStored('schoonmaak_name',name);setPersonalSplash(name);}
    const minSplash=850;
    const wait=Math.max(0,minSplash-(Date.now()-startedAt));
    setTimeout(function(){
      frame.classList.add('ready');
      splash.classList.add('hide');
      setTimeout(function(){splash.style.display='none';},300);
    },wait);
  }

  function showLauncherError(message){
    const lang=getAppLang()||'nl';
    const fallback=lang==='en'?'The schedule could not be loaded.':lang==='es'?'No se pudo cargar el horario.':'Het rooster kon niet worden geladen.';
    const text=String(message||fallback);
    const target=loadingLine.querySelector('span:last-child');
    if(target)target.textContent='⚠️ '+text;
    openBtn.style.display='block';
    openBtn.textContent=(getAppLang()==='en'?'Try again':getAppLang()==='es'?'Intentar de nuevo':'Opnieuw proberen');
    openBtn.onclick=function(){location.reload();};
  }

  window.addEventListener('message',function(e){
    const data=e.data||{};
    if(data.type==='SCHOONMAAK_DIAG'){
      lastStartupDiag=String(data.step||'')+'|'+String(data.detail||'');
      const step=String(data.step||'');
      const detail=String(data.detail||'');
      setStartupStatus_('Opstart '+step+' · '+detail);

      // Stap 4 betekent: de app-shell zelf staat klaar. Laat die meteen zien.
      // We wachten dus niet langer op het volledige dagrooster of een apart READY-signaal.
      if(step==='4' && !frame.classList.contains('ready')){
        revealApp(String(data.name||''));
      }
      return;
    }
    if(data.type==='SCHOONMAAK_LANGUAGE'){
      const lang=normalizeLang(data.language);
      if(lang){
        setStored('schoonmaak_lang',lang);
        if(getPendingLang()===lang)removeStored('schoonmaak_lang_pending');
        applyLauncherLanguage();
        setPersonalSplash('');
      }
      return;
    }
    if(data.type==='SCHOONMAAK_READY'){
      const lang=normalizeLang(data.language);
      if(lang){
        setStored('schoonmaak_lang',lang);
        if(getPendingLang()===lang)removeStored('schoonmaak_lang_pending');
        applyLauncherLanguage();
      }
      revealApp(String(data.name||''));
      return;
    }
    if(data.type==='SCHOONMAAK_ERROR'){
      showLauncherError(data.message||'Het rooster kon niet worden geladen.');
    }
  });

  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  const savedLang=getAppLang();
  const needsLanguageChoice=getStored('schoonmaak_lang_picker_done')!=='2';
  if(needsLanguageChoice){
    // Eenmalige duidelijke keuze vóór de app wordt gestart.
    loadingLine.style.display='none';
    openBtn.style.display='none';
    const chooser=document.getElementById('languageChooser');
    if(chooser)chooser.classList.remove('saved');
  }else if(savedLang){
    applyLauncherLanguage();
    const chooser=document.getElementById('languageChooser');
    if(chooser)chooser.classList.add('saved');
    if(standalone){
      startAppLoad();
    }else{
      loadingLine.style.display='none';
      openBtn.style.display='block';
      openBtn.addEventListener('click',startAppLoad);
    }
  }else{
    loadingLine.style.display='none';
    openBtn.style.display='none';
  }
})();
</script>
